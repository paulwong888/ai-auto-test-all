name: ${COMPOSE_PROJECT_NAME:-ai-auto-test-playwright}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-ai-auto-test-playwright-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_auto_test_playwright}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_auto_test_playwright}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-ai-auto-test-playwright-redis}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - app-net
    restart: unless-stopped

  worker:
    container_name: ${WORKER_CONTAINER_NAME:-ai-auto-test-playwright-worker}
    build:
      context: ..
      dockerfile: docker/worker/Dockerfile
    environment:
      PORT: 8081
      WORKER_ID: worker-1
    volumes:
      - ${PROJECTS_DATA_HOST_PATH:-./data/projects}:/data/projects
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/worker/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    container_name: ${SERVER_CONTAINER_NAME:-ai-auto-test-playwright-server}
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    env_file:
      - .env
      - .env.local
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3001}
      WORKER_URL: ${WORKER_URL:-http://worker:8081}
      WORKER_VNC_HOST: ${WORKER_VNC_HOST:-worker}
      WORKER_VNC_PORT: ${WORKER_VNC_PORT:-6080}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      MASTER_KEY: ${MASTER_KEY:-dev-master-key}
      RECORDER_IMAGE: ${RECORDER_IMAGE:-ai-auto-test-playwright-recorder:latest}
      RECORDER_VNC_HOST: ${RECORDER_VNC_HOST:-host.docker.internal}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_auto_test_playwright}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ALLOWED_REPO_PREFIXES: ${ALLOWED_REPO_PREFIXES:-/data/projects}
      PROJECTS_DATA_PATH: ${PROJECTS_DATA_PATH:-/data/projects}
      PROJECTS_DATA_HOST_PATH: ${PROJECTS_DATA_HOST_PATH:-./data/projects}
      GIT_SSH_COMMAND: ${GIT_SSH_COMMAND:-ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes}
    volumes:
      - ${PROJECTS_DATA_HOST_PATH:-./data/projects}:/data/projects
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SSH_DIR:-${HOME}/.ssh}:/root/.ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      worker:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    container_name: ${DASHBOARD_CONTAINER_NAME:-ai-auto-test-playwright-dashboard}
    build:
      context: ..
      dockerfile: docker/dashboard/Dockerfile
    ports:
      - "${DASHBOARD_PORT:-8040}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
