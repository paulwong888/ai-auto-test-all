name: ${COMPOSE_PROJECT_NAME:-ai-auto-test-monday}

services:
  temporal-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    networks:
      - monday-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    networks:
      - monday-net

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8088},http://127.0.0.1:${TEMPORAL_UI_PORT:-8088}
    ports:
      - "0.0.0.0:${TEMPORAL_UI_PORT:-8088}:8080"
    networks:
      - monday-net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - monday-net

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "0.0.0.0:${MINIO_API_PORT:-9000}:9000"
      - "0.0.0.0:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - monday-net
      
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    networks:
      - monday-net
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} 2>/dev/null; do sleep 2; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      exit 0;
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-monday-artifacts}

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "3010"
      TEMPORAL_ADDRESS: temporal:7233
      REDIS_URL: redis://redis:6379
      ARTIFACTS_BASE_DIR: /data/artifacts
      ARTIFACT_STORE: ${ARTIFACT_STORE:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-monday-artifacts}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      REPOS_BASE_DIR: /data/repos
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5433}
      POSTGRES_DB: ${POSTGRES_DB:-ai_auto_test_monday}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/artifacts:/data/artifacts
      - ./data/repos:/data/repos
      - ${EXTERNAL_REPOS_HOST_PATH:-./data/repos/external}:${EXTERNAL_REPOS_CONTAINER_PATH:-/data/repos/external}:ro
      - ${SANDBOX_REPOS_HOST_PATH:-../../ai-auto-test-platform/sandbox-repos}:${SANDBOX_REPOS_CONTAINER_PATH:-/data/repos/sandbox}:ro
      - ${GIT_SSH_HOST_PATH:-${HOME}/.ssh}:/root/.ssh:ro
    ports:
      - "0.0.0.0:${API_PORT:-3010}:3010"
    depends_on:
      temporal:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - monday-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: docker/worker/Dockerfile
    env_file:
      - .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      REDIS_URL: redis://redis:6379
      ARTIFACTS_BASE_DIR: /data/artifacts
      ARTIFACT_STORE: ${ARTIFACT_STORE:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-monday-artifacts}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      REPOS_BASE_DIR: /data/repos
      HIGRESS_BASE_URL: ${HIGRESS_BASE_URL:-http://host.docker.internal:8004/v1}
      HIGRESS_API_KEY: ${HIGRESS_API_KEY:-not-needed}
      LLM_MODEL: ${LLM_MODEL:-ds-v4-flash-0731-dspark}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-900}
      CHOREOGRAPHER_LLM_TIMEOUT: ${CHOREOGRAPHER_LLM_TIMEOUT:-600}
      LLM_STREAM_ENABLED: ${LLM_STREAM_ENABLED:-true}
      LLM_STREAM_CHUNK_TIMEOUT: ${LLM_STREAM_CHUNK_TIMEOUT:-600}
      SCRIPT_ANALYST_LLM_TIMEOUT: ${SCRIPT_ANALYST_LLM_TIMEOUT:-1800}
      SCRIPT_ANALYST_LLM_STREAM_CHUNK_TIMEOUT: ${SCRIPT_ANALYST_LLM_STREAM_CHUNK_TIMEOUT:-1800}
      SCAN_MAX_FILES: ${SCAN_MAX_FILES:-300}
      SCAN_MAX_COMPONENTS: ${SCAN_MAX_COMPONENTS:-80}
      JOURNEY_MIN: ${JOURNEY_MIN:-5}
      JOURNEY_MAX: ${JOURNEY_MAX:-8}
      POM_BATCH_SIZE: ${POM_BATCH_SIZE:-5}
      CHOREOGRAPHER_BATCH_SIZE: ${CHOREOGRAPHER_BATCH_SIZE:-8}
      FULL_COVERAGE: ${FULL_COVERAGE:-true}
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:-http://host.docker.internal:3001}
      PLATFORM_EXECUTION_ENABLED: ${PLATFORM_EXECUTION_ENABLED:-true}
      EXECUTION_MODE: ${EXECUTION_MODE:-auto}
      PLAYWRIGHT_CLI_PATH: ${PLAYWRIGHT_CLI_PATH:-/data/repos/sandbox/demo-app/node_modules/@playwright/test/cli.js}
      PLAYWRIGHT_NODE_PATH: ${PLAYWRIGHT_NODE_PATH:-/data/repos/sandbox/demo-app/node_modules}
      PLAYWRIGHT_TEST_TIMEOUT_MS: ${PLAYWRIGHT_TEST_TIMEOUT_MS:-50000}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5433}
      POSTGRES_DB: ${POSTGRES_DB:-ai_auto_test_monday}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/repos:/data/repos
      - ${EXTERNAL_REPOS_HOST_PATH:-./data/repos/external}:${EXTERNAL_REPOS_CONTAINER_PATH:-/data/repos/external}
      - ${SANDBOX_REPOS_HOST_PATH:-../../ai-auto-test-platform/sandbox-repos}:${SANDBOX_REPOS_CONTAINER_PATH:-/data/repos/sandbox}
      - ${GIT_SSH_HOST_PATH:-${HOME}/.ssh}:/root/.ssh:ro
    depends_on:
      temporal:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - monday-net
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard/Dockerfile
    ports:
      - "0.0.0.0:${DASHBOARD_PORT:-8040}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - monday-net

networks:
  monday-net:
    driver: bridge

volumes:
  temporal_pg_data:
  minio_data:
