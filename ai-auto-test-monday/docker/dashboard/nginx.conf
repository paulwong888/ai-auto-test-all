server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass http://api:3010/health;
  }

  location /ws {
    proxy_pass http://api:3010/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Long-running agents (choreographer/continuityLead) can emit no events
    # for minutes — don't let the proxy kill idle sockets (default 60s).
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Always revalidate index.html so browsers pick up new bundles after deploy.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Hashed assets are immutable — safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
